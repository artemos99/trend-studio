d:#192338;padding:11px 12px}.comp-clip-index{font-weight:900;color:#c0b0ff;width:19px}.comp-clip-info{flex:1;min-width:0}.comp-clip-info b{font-size:12px;display:block;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comp-clip-info small{display:block;color:#94a6bb;font-size:10px;line-height:1.5;margin-top:4px}.comp-clip .btn{padding:6px 9px}.comp-stats{display:flex;gap:10px;flex-wrap:wrap;margin:9px 0 11px;color:#a4b3cd;font-size:11px}.comp-stats strong{color:#f0edfe}.comp-subtle{border:1px solid #4a4567;border-radius:11px;background:#22243b;padding:13px 14px;color:#cccae5;font-size:11px;line-height:1.65}.comp-subtle.gold{border-color:#685a34;background:#262637;color:#e7d19c}.comp-textarea{resize:vertical;min-height:105px;line-height:1.55}.comp-result{margin-top:14px;border:1px solid #326456;border-radius:11px;background:#18342e;padding:12px;color:#a6f6d9;line-height:1.5;font-size:12px}.comp-progress{width:100%;height:8px;background:#2c3851;border-radius:12px;overflow:hidden;margin:12px 0}.comp-progress span{height:100%;background:linear-gradient(90deg,#9984ff,#77dcc4);display:block;transition:width .18s linear}.comp-btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.comp-empty{border:1px dashed #3e4760;border-radius:12px;padding:18px;text-align:center;color:#93a3bd;line-height:1.6;font-size:12px}.comp-footer{font-size:11px;color:#96a6bc;line-height:1.7}.comp-preview-card{margin-top:14px;padding:13px;border:1px solid #30425c;border-radius:12px;background:#0d1728}.comp-preview-card video{width:100%;max-height:340px;background:black;border-radius:9px}.comp-caption{font-size:10px;color:#7e93b2;margin-top:5px}.comp-warning{border-left:3px solid #eac57c;color:#c0b99e;padding:3px 0 3px 11px;font-size:11px;line-height:1.65;margin-top:12px}.comp-check{display:flex;gap:9px;align-items:flex-start;color:#b2c2d7;font-size:11px;line-height:1.5;margin-top:12px}.comp-check input{accent-color:#a997ff;margin-top:3px}.comp-badge{background:#28384c;
